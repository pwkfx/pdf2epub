[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2epub"
version = "0.5.0"
description = "Convert PDF, Word, and DjVu documents to EPUB 3.3 and repair EPUBs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "html5lib>=1.1,<2",
    "mammoth>=1.9,<2",
    "Pillow>=10.4,<12; python_version < '3.10'",
    "Pillow>=10.4,<13; python_version >= '3.10'",
    "pymorphy3>=2.0.6,<3",
    "pypdf>=6,<7",
    "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
pdf2epub = "pdf2epub.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf2epub = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "external_tools: integration tests requiring LibreOffice, DjVuLibre, or Tesseract",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
